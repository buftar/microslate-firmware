; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xteink_x4
extra_configs = platformio.local.ini

[env:xteink_x4]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino, espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_unflags = 
	-std=gnu++11
	-Werror=int-in-bool-context
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
	-DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
	-DDISABLE_FS_H_WARNING=1
	-DCORE_DEBUG_LEVEL=0
	-DXTEINK_X4_HARDWARE=1
	-DCONFIG_NIMBLE_CPP_IDF=1
	-DCONFIG_BT_NIMBLE_LEGACY_VHCI_ENABLE=1
	-DOMIT_FONTS=1
	-DRELEASE_BUILD
	-std=gnu++17
lib_deps = h2zero/esp-nimble-cpp@2.3.4

[env:xteink_x4_debug]
extends = env:xteink_x4
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
	-DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
	-DDISABLE_FS_H_WARNING=1
	-DCORE_DEBUG_LEVEL=0
	-DXTEINK_X4_HARDWARE=1
	-DCONFIG_NIMBLE_CPP_IDF=1
	-DCONFIG_BT_NIMBLE_LEGACY_VHCI_ENABLE=1
	-DOMIT_FONTS=1
	-std=gnu++17
monitor_port = COM5
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
upload_protocol = esptool
upload_speed = 115200
upload_port = COM5
lib_deps = 
	h2zero/esp-nimble-cpp@2.3.4
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes
