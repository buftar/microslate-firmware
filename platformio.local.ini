; Isolate MicroSlate's package/platform/toolchain cache from CrossInk's ~/.platformio
; store. Both projects declare packages with the same names but different, incompatible
; versions/sources (CrossInk uses the pioarduino platform-espressif32 fork;
; microslate-firmware uses the official PlatformIO espressif32 platform). PlatformIO
; keeps only one copy per package name in its default unversioned package dir, so
; building one project can silently overwrite the other's dependency and break its
; next build (manifests as a FRAMEWORK_DIR TypeError during SCons framework setup).
; A dedicated core_dir makes this structurally impossible.
; Provenance: Mark I diagnosis (xteink-writer/DUAL_BOOT.md), implemented for Mark III.
[platformio]
core_dir = .pio/core
